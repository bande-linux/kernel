name: follow-debian

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the archive already serves this version
        type: boolean
        default: false
      debian_version:
        description: Test-build this Debian linux version (any suite) instead of testing's; never published
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      debian: ${{ steps.versions.outputs.debian }}
      version: ${{ steps.versions.outputs.version }}
      build: ${{ steps.versions.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare Debian testing with the archive
        id: versions
        env:
          FORCE: ${{ inputs.force }}
          TEST_VERSION: ${{ inputs.debian_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          debian=${TEST_VERSION:-$(scripts/debian-version.sh)}
          version=$(scripts/version.sh "$debian")
          published=$(scripts/published.sh)
          build=true
          # We only build Debian's kernel with our Mac patches: while Debian is on an older series
          # than our newest patches (testing behind experimental), there is nothing to build.
          set +e
          scripts/series.sh "$debian" > /dev/null
          series_rc=$?
          set -e
          if [ $series_rc = 4 ] || [ $series_rc = 1 ]; then
            echo "Debian: linux $debian; no build: our patches are for a newer series, paused until Debian reaches it"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          built=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bande-version-$version" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          if [ -z "$TEST_VERSION" ] && [ "$FORCE" != true ] && { [ "$published" = "$version" ] || [ "$built" -gt 0 ]; }; then
            build=false
          fi
          echo "Debian: linux $debian; ours: $version; published: ${published:-none}; built: $built; build: $build"
          {
            echo "debian=$debian"
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    concurrency:
      group: follow-debian-${{ inputs.debian_version || 'testing' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      DEBIAN_VERSION: ${{ needs.check.outputs.debian }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Start the Debian testing container
        run: |
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          docker run -d --name build -v "$PWD:/repo" -v "$RUNNER_TEMP/work:/work" -v "$RUNNER_TEMP/out:/out" \
            debian:testing sleep infinity

      - name: Fetch Debian's source
        run: docker exec build /repo/scripts/build.sh fetch "$DEBIAN_VERSION" /work

      - name: Prepare it with our flavour and patches
        id: prepare
        run: |
          set +e
          docker exec build sh -c '/repo/scripts/prepare.sh /work/linux-*/ "$0"' "$VERSION"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ $rc = 0 ] || [ $rc = 3 ]

      - name: Refresh our patches with Claude
        if: steps.prepare.outputs.rc == '3'
        timeout-minutes: 180
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "A patch doesn't apply and CLAUDE_CODE_OAUTH_TOKEN isn't set"; exit 1; }
          docker exec build sh -c 'apt-get install -y -qq curl bash >/dev/null && useradd -m fixer && chown -R fixer /work /repo/patches'
          docker exec -u fixer build bash -c 'curl -fsSL https://claude.ai/install.sh | bash -s stable >/dev/null'
          docker exec -u fixer -e CLAUDE_CODE_OAUTH_TOKEN -w /work build bash -c '
            src=$(ls -d /work/linux-*/)
            series=$(ls -d /repo/patches/$(echo "'"${DEBIAN_VERSION%%-*}"'" | sed "s/~.*//" | cut -d. -f1-2))
            ~/.local/bin/claude -p "$(cat /repo/scripts/refresh-prompt.md)
          The Debian source is $src, version '"$DEBIAN_VERSION"'. Our patches are in $series/, listed in $series/series." \
              --model claude-opus-5-5 --effort high --permission-mode dontAsk --max-turns 300 \
              --add-dir /repo/patches \
              --allowedTools "Read" "Edit" "Write" "Glob" "Grep" "Bash(quilt *)" "Bash(cd *)" "Bash(ls *)" \
                "Bash(diff *)" "Bash(patch *)" "Bash(cp *)" "Bash(cat *)" "Bash(grep *)" "Bash(make *)"'
          docker exec build sh -c 'rm -rf /work/*'
          docker exec build /repo/scripts/build.sh fetch "$DEBIAN_VERSION" /work
          docker exec build sh -c '/repo/scripts/prepare.sh /work/linux-*/ "$0"' "$VERSION"

      - name: Keep the refreshed patches on a branch
        if: steps.prepare.outputs.rc == '3'
        run: |
          # The refresh and the build may outlast the job's time limit; keep the refreshed series
          # on its own branch, so it isn't lost. It reaches main only after the checks below.
          git config user.name "Bande CI"
          git config user.email "ci@bande-linux.github.io"
          git checkout -b "refresh/linux-${DEBIAN_VERSION//[~:]/-}"
          git add patches
          git commit -m "Refresh the patches for Debian linux $DEBIAN_VERSION (by Claude)"
          git push -f origin HEAD

      - name: Build the flavour and bande-os-apple
        run: docker exec build /repo/scripts/build.sh compile "$VERSION" /work /out

      - name: Check the config is Debian's plus apple.config
        run: docker exec build sh -c '/repo/scripts/config-diff.sh /work/linux-*/'

      - name: Boot it in QEMU
        run: docker exec build /repo/scripts/qemu-boot.sh /out

      - name: Commit refreshed or new patches
        if: inputs.debian_version == ''
        run: |
          # Only now, with the build and its checks passed: a refreshed series (Claude) or a new
          # one prepare.sh started from our newest. A test build never commits.
          git config user.name "Bande CI"
          git config user.email "ci@bande-linux.github.io"
          git add patches
          git diff --cached --quiet || git commit -m "Port the patches to Debian linux $DEBIAN_VERSION"
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || git push origin HEAD:main
          [ "${{ steps.prepare.outputs.rc }}" != 3 ] || git push origin --delete "refresh/linux-${DEBIAN_VERSION//[~:]/-}"

      - name: Name the version
        run: echo "$VERSION" > "$RUNNER_TEMP/version"

      - uses: actions/upload-artifact@v7
        with:
          name: bande-debs-arm64
          path: ${{ runner.temp }}/out/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: inputs.debian_version == ''
        with:
          name: bande-version-${{ needs.check.outputs.version }}
          path: ${{ runner.temp }}/version
